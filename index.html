<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f5f7">
<meta name="robots" content="noindex, nofollow">
<title>Рокси</title>
<style>
  :root {
    --bg:#f4f5f7; --card:#fff; --fg:#101418; --muted:#5d6672; --line:#e6e8ec;
    --fed:#15803d; --fed-soft:#dcfce7; --fed-dot:#22c55e;
    --warn:#b45309; --warn-soft:#fef3c7; --warn-dot:#f59e0b; --warn-line:#fcd34d;
    --err:#b91c1c;  --err-soft:#fee2e2;  --err-line:#fca5a5;
    --idle:#4b5563; --idle-dot:#cfd4dc;
    --shadow:0 1px 2px rgba(16,20,24,.05), 0 10px 30px rgba(16,20,24,.07);
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size:18px; line-height:1.4;
    -webkit-font-smoothing:antialiased;
    padding:
      calc(env(safe-area-inset-top) + 16px)
      calc(env(safe-area-inset-right) + 14px)
      calc(env(safe-area-inset-bottom) + 20px)
      calc(env(safe-area-inset-left) + 14px);
    /* Fill the screen and sit in the middle of it, rather than hugging
       the top half. dvh so mobile browser chrome doesn't cause a jump. */
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    justify-content:center;
    justify-content:safe center;   /* dropped by browsers that lack it */
  }
  #app { width:100%; max-width:460px; margin-left:auto; margin-right:auto; }

  /* ---------- banners ---------- */
  .banner {
    display:flex; gap:12px; align-items:flex-start;
    border-radius:18px; padding:16px 18px; margin-bottom:16px;
    font-size:1.1rem; font-weight:650; line-height:1.3;
  }
  .banner .ico { font-size:1.35rem; line-height:1.1; flex:none; }
  .banner-warn { background:var(--warn-soft); color:var(--warn); border:1.5px solid var(--warn-line); }
  .banner-err  { background:var(--err-soft);  color:var(--err);  border:1.5px solid var(--err-line); }
  .banner b { font-weight:800; }
  .banner .sub { display:block; font-weight:550; opacity:.9; margin-top:4px; font-size:1rem; }
  .banner .retry {
    margin-left:auto; flex:none; align-self:center;
    background:transparent; border:1.5px solid currentColor; color:inherit;
    border-radius:999px; padding:9px 17px; font:inherit; font-size:.95rem; font-weight:700;
    cursor:pointer; white-space:nowrap;
  }
  .banner .retry:active { opacity:.6; }

  /* ---------- card ---------- */
  .card {
    background:var(--card); border-radius:28px; box-shadow:var(--shadow);
    padding:34px 20px 26px; text-align:center;
  }
  .dog {
    font-size:1rem; font-weight:800; letter-spacing:.15em; text-transform:uppercase;
    color:var(--muted); margin-bottom:22px;
  }

  .status { transition:opacity .18s ease; }
  .status.stale { opacity:.45; }

  /* Sized for Bulgarian: "Не е хранена" is twice the length of "Not fed"
     and is expected to wrap to two lines. That's fine — it fills the card. */
  .headline {
    font-size:clamp(2.8rem, 14vw, 4.4rem); font-weight:900;
    letter-spacing:-.04em; line-height:.98; margin:0;
    overflow-wrap:break-word; text-wrap:balance;
  }
  /* Narrow phones: step down so single words like "Неизвестно" stay
     whole rather than falling back to a mid-word break. */
  @media (max-width: 360px) { .headline { font-size:2.4rem; } }

  .headline.is-fed  { color:var(--fed); }
  .headline.is-idle { color:var(--idle); }
  .headline.is-err  { color:var(--muted); }
  .headline.is-warn { color:var(--warn); }

  .sub1 { margin-top:18px; font-size:1.85rem; font-weight:800; letter-spacing:-.02em; }
  .sub2 { margin-top:6px; font-size:1.25rem; font-weight:600; color:var(--muted); }

  .pulse { animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }

  /* ---------- actions ---------- */
  .actions { margin-top:30px; }
  .btn {
    display:block; width:100%; min-height:82px; padding:14px 16px;
    border:none; border-radius:22px; cursor:pointer;
    font:inherit; font-size:1.35rem; font-weight:800; letter-spacing:-.02em;
    color:#fff; background:var(--fed-dot);
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active { transform:scale(.975); }
  .btn[disabled] { opacity:.55; cursor:default; transform:none; }
  .btn-warn { background:var(--warn-dot); }
  .btn-ghost {
    background:transparent; color:var(--muted);
    border:1.5px solid var(--line); min-height:66px; font-size:1.15rem; font-weight:700;
  }

  .linkish {
    display:inline-block; margin-top:8px; padding:16px 20px;
    background:none; border:none; cursor:pointer;
    font:inherit; font-size:1.2rem; font-weight:600; color:var(--muted);
    text-decoration:underline; text-decoration-color:#c9cfd8;
    text-underline-offset:5px;
  }
  .linkish:active { opacity:.55; }

  .undo-row { margin-top:18px; font-size:1.1rem; font-weight:600; color:var(--muted); }
  /* Distinct from the muted label beside it — this one removes a record. */
  .undo-row button {
    background:none; border:none; font:inherit; font-weight:800;
    color:var(--err); text-decoration:underline; text-decoration-color:var(--err-line);
    text-underline-offset:4px; padding:12px 8px; cursor:pointer;
  }
  .undo-row button:active { opacity:.6; }

  /* ---------- confirm panel ---------- */
  .confirm {
    margin-top:26px; text-align:left;
    background:var(--warn-soft); border:1.5px solid var(--warn-line);
    border-radius:20px; padding:20px;
  }
  .confirm p { margin:0 0 18px; font-size:1.25rem; line-height:1.4; color:var(--warn); font-weight:650; }
  .confirm p b { font-weight:900; }
  .confirm .btn { min-height:70px; font-size:1.25rem; }
  .confirm .btn-ghost { margin-top:10px; }

  /* ---------- history ---------- */
  .history { margin-top:30px; padding-top:24px; border-top:1.5px solid var(--line); }
  .hlabel {
    font-size:.88rem; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
    color:var(--muted); margin-bottom:16px;
  }
  .dots { display:flex; justify-content:space-between; gap:6px; }
  .day { flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .dot { width:26px; height:26px; border-radius:50%; background:var(--idle-dot); }
  .dot.one  { background:var(--fed-dot); }
  .dot.many { background:var(--warn-dot); box-shadow:0 0 0 5px var(--warn-soft); }
  .dot.today { outline:2.5px solid var(--fg); outline-offset:4px; }
  .dname { font-size:.92rem; font-weight:700; color:var(--muted); }

  .foot { margin-top:20px; text-align:center; font-size:.9rem; font-weight:600; color:var(--muted); opacity:.75; }

  .plain { text-align:center; padding:40px 20px; color:var(--muted); }
  .plain h1 { font-size:1.9rem; font-weight:800; color:var(--fg); margin:0 0 12px; letter-spacing:-.02em; }
  .plain p { font-size:1.15rem; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://dckgfwievtugvllxseue.supabase.co";
  var ANON_KEY     = "sb_publishable_2h5zLJJhtaLGCrSvgyNAcQ_QLf_gOm8";

  // Pinned rather than taken from the phone, so the page reads the same on
  // every device: 24-hour clock and Bulgarian weekday labels.
  var LOCALE = "bg-BG";

  var TOKEN = new URLSearchParams(location.search).get("d");
  var app = document.getElementById("app");

  // ---- state -------------------------------------------------------------
  // The server is the record. Nothing here is persisted; `undo` is the only
  // purely-local concept and it is re-validated server-side anyway.
  var S = {
    data: null,        // last successful get_status payload
    goodAt: 0,         // Date.now() of that success
    skew: 0,           // server_now - device_now, ms
    loading: true,
    reachable: true,   // did the most recent request succeed?
    invalid: false,    // token missing or unrecognised
    confirming: false,
    busy: false,
    optimistic: null,  // ISO string of a feed we've shown but not yet confirmed
    undo: null,        // { id, expires }
    flash: null,       // { kind, text }
    retries: 0
  };
  var retryTimer = null, tickTimer = null;

  function set(patch) { for (var k in patch) S[k] = patch[k]; render(); }
  function now() { return Date.now() + S.skew; }   // server-aligned clock
  function tz() { return (S.data && S.data.timezone) || undefined; }

  // ---- api ---------------------------------------------------------------
  function rpc(fn, body) {
    var ctl = new AbortController();
    var to = setTimeout(function () { ctl.abort(); }, 9000);
    return fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
      method: "POST",
      cache: "no-store",
      signal: ctl.signal,
      headers: {
        "Content-Type": "application/json",
        apikey: ANON_KEY,
        Authorization: "Bearer " + ANON_KEY
      },
      body: JSON.stringify(body)
    }).then(function (r) {
      clearTimeout(to);
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }, function (e) { clearTimeout(to); throw e; });
  }

  // Every response funnels through here so "reachable" and the clock offset
  // are updated in exactly one place.
  function accept(res) {
    if (!res || res.ok !== true) { set({ invalid: true, loading: false }); return null; }
    S.skew = new Date(res.server_now).getTime() - Date.now();
    S.data = res;
    S.goodAt = Date.now();
    S.reachable = true;
    S.retries = 0;
    S.loading = false;
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    return res;
  }

  function unreachable() {
    S.reachable = false;
    S.loading = false;
    S.optimistic = null;      // never let an unconfirmed feed linger as truth
    scheduleRetry();
  }

  function scheduleRetry() {
    if (retryTimer) return;
    var wait = [3000, 6000, 12000, 20000][Math.min(S.retries, 3)];
    S.retries++;
    retryTimer = setTimeout(function () { retryTimer = null; load(); }, wait);
  }

  function load() {
    if (!TOKEN) { set({ invalid: true, loading: false }); return Promise.resolve(); }
    return rpc("get_status", { p_token: TOKEN })
      .then(function (r) { accept(r); render(); })
      .catch(function () { unreachable(); render(); });
  }

  // ---- actions -----------------------------------------------------------
  function feed(confirm) {
    if (S.busy) return;
    S.busy = true;
    S.confirming = false;
    S.flash = null;
    // Optimistic: flip the answer immediately. Standing at the bowl on bad
    // wifi shouldn't feel broken. Reverted below if the write doesn't land.
    S.optimistic = new Date(now()).toISOString();
    render();

    rpc("record_feed", { p_token: TOKEN, p_confirm: !!confirm })
      .then(function (res) {
        S.busy = false;
        S.optimistic = null;
        if (!accept(res)) return;

        if (res.action === "needs_confirm") {
          S.confirming = true;                       // interrupt, nothing written
        } else if (res.action === "recorded" || res.action === "deduped") {
          // 'deduped' must look identical to a normal tap — the user
          // double-tapped by accident and doesn't need to hear about it.
          if (res.last_feed_id) S.undo = { id: res.last_feed_id, expires: now() + 10 * 60 * 1000 };
        }
        render();
      })
      .catch(function () {
        S.busy = false;
        // The write is unconfirmed, so it must not be shown as done.
        S.flash = { kind: "err", text: "Не е записано — няма връзка със сървъра." };
        unreachable();
        render();
      });
  }

  function undo() {
    if (S.busy || !S.undo) return;
    S.busy = true; S.flash = null; render();
    rpc("undo_feed", { p_token: TOKEN, p_event_id: S.undo.id })
      .then(function (res) {
        S.busy = false;
        if (!accept(res)) return;
        if (res.action === "undone") S.undo = null;
        else S.flash = { kind: "muted", text: "Твърде късно е за отмяна." };
        render();
      })
      .catch(function () {
        S.busy = false;
        S.flash = { kind: "err", text: "Неуспешна отмяна — няма връзка." };
        unreachable();
        render();
      });
  }

  // ---- formatting --------------------------------------------------------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function clock(iso) {
    try {
      return new Intl.DateTimeFormat(LOCALE, {
        hour: "numeric", minute: "2-digit", timeZone: tz()
      }).format(new Date(iso));
    } catch (e) { return new Date(iso).toTimeString().slice(0, 5); }
  }

  // Bulgarian puts "преди" in front rather than "ago" behind, and counts
  // with the plural form: 1 минута / 2 минути, 1 час / 2 часа, 1 ден / 2 дни.
  function ago(iso) {
    var m = Math.round((now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return "току-що";
    if (m === 1) return "преди 1 минута";
    if (m < 60) return "преди " + m + " минути";
    var h = Math.floor(m / 60), r = m % 60;
    if (h < 24) return "преди " + (h === 1 ? "1 час" : h + " часа") + (r ? " и " + r + " мин" : "");
    var dd = Math.floor(h / 24);
    return "преди " + (dd === 1 ? "1 ден" : dd + " дни");
  }

  function joinTimes(list) {
    var t = list.map(function (f) { return clock(f.at); });
    if (t.length <= 1) return t.join("");
    return t.slice(0, -1).join(", ") + " и " + t[t.length - 1];
  }

  // ---- render ------------------------------------------------------------
  function render() {
    if (S.invalid) {
      app.innerHTML =
        '<div class="plain"><h1>Този линк не е валиден</h1>' +
        "<p>Проверете адреса и опитайте отново.</p></div>";
      return;
    }
    if (S.loading && !S.data) {
      app.innerHTML =
        '<div class="card"><div class="dog">&nbsp;</div>' +
        '<p class="headline is-err pulse">&hellip;</p>' +
        '<div class="sub2" style="margin-top:16px">Проверява се&hellip;</div></div>';
      return;
    }

    var d = S.data;
    var stale = !S.reachable;
    var html = "";

    // --- optimistic overlay: treat a pending feed as one of today's feeds ---
    var feeds = d ? d.feeds_today.slice() : [];
    var count = d ? d.feed_count_today : 0;
    if (S.optimistic) { feeds.push({ id: -1, at: S.optimistic }); count += 1; }
    var lastAt = feeds.length ? feeds[feeds.length - 1].at : null;

    // --- banners ---
    if (!S.reachable) {
      html +=
        '<div class="banner banner-err" role="alert"><span class="ico">⚠️</span>' +
        "<span><b>Няма връзка със сървъра</b>" +
        '<span class="sub">' +
        (d ? "Последна проверка: " + esc(ago(new Date(S.goodAt + S.skew).toISOString())) + "."
           : "Няма налична информация.") +
        "</span></span>" +
        '<button class="retry" id="retry">Опитай пак</button></div>';
    }
    if (S.flash && S.flash.kind === "err") {
      html += '<div class="banner banner-err" role="alert"><span class="ico">✕</span><span>' +
              esc(S.flash.text) + "</span></div>";
    }
    // Something went wrong today and whoever is looking needs to know
    // before they add a third.
    if (S.reachable && count > 1) {
      html += '<div class="banner banner-warn" role="alert"><span class="ico">⚠️</span>' +
              "<span><b>Хранена " + count + "× днес</b>" +
              '<span class="sub">' + esc(joinTimes(feeds)) + "</span></span></div>";
    }

    html += '<div class="card">';
    html += '<div class="dog">' + esc(d ? d.dog_name : " ") + "</div>";
    html += '<div class="status' + (stale ? " stale" : "") + '" aria-live="polite">';

    if (!d) {
      // No data at all + no connection. Say so. Never guess "not fed".
      html += '<p class="headline is-err">Неизвестно</p>' +
              '<div class="sub1">Няма как да се провери</div>' +
              '<div class="sub2">Няма интернет или сървърът не отговаря.</div>';
    } else if (count > 1) {
      html += '<p class="headline is-warn">Хранена ' + count + "×</p>" +
              '<div class="sub1">Последно в ' + esc(clock(lastAt)) + "</div>" +
              '<div class="sub2">' + esc(ago(lastAt)) + "</div>";
    } else if (count === 1) {
      html += '<p class="headline is-fed">Нахранена</p>' +
              '<div class="sub1">в ' + esc(clock(lastAt)) + "</div>" +
              '<div class="sub2">' + esc(ago(lastAt)) + "</div>";
    } else {
      html += '<p class="headline is-idle">Не е хранена</p>' +
              '<div class="sub2" style="margin-top:12px">Няма записано хранене днес</div>';
    }
    html += "</div>"; // .status

    // --- actions ---
    html += '<div class="actions">';
    if (!d) {
      html += '<button class="btn btn-ghost" id="retry2">Опитай отново</button>';
    } else if (S.confirming) {
      html += '<div class="confirm"><p>' + esc(d.dog_name) + " е хранена в <b>" +
              esc(clock(lastAt)) + "</b>, " + esc(ago(lastAt)) +
              ". Да се запише ли второ хранене?</p>" +
              '<button class="btn btn-warn" id="confirm">Да, запиши го</button>' +
              '<button class="btn btn-ghost" id="cancel">Отказ</button></div>';
    } else if (count === 0) {
      html += '<button class="btn" id="feed"' + (S.busy ? " disabled" : "") + ">" +
              (S.busy ? "Записва се…" : "Отбележи като нахранена") + "</button>";
    } else {
      // Already fed. The primary action is now *nothing* — you have your
      // answer and you walk away. So this is deliberately not button-shaped.
      html += '<button class="linkish" id="again"' + (S.busy ? " disabled" : "") + ">" +
              "Нахрани отново</button>";
    }

    if (S.undo && S.undo.expires > now() && count > 0 && !S.confirming) {
      html += '<div class="undo-row">Записано по грешка? <button id="undo">Отмени</button></div>';
    }
    if (S.flash && S.flash.kind === "muted") {
      html += '<div class="undo-row">' + esc(S.flash.text) + "</div>";
    }
    html += "</div>"; // .actions

    // --- history ---
    if (d && d.days && d.days.length) {
      html += '<div class="history"><div class="hlabel">Последните 7 дни</div><div class="dots">';
      d.days.forEach(function (day, i) {
        var c = day.count;
        if (i === d.days.length - 1) c = count;          // today, incl. optimistic
        var cls = c === 0 ? "" : (c === 1 ? " one" : " many");
        var today = i === d.days.length - 1 ? " today" : "";
        var name;
        try {
          name = new Intl.DateTimeFormat(LOCALE, { weekday: "short", timeZone: tz() })
                   .format(new Date(day.day_start));
        } catch (e) { name = ""; }
        html += '<div class="day"><div class="dot' + cls + today + '"></div>' +
                '<div class="dname">' + esc(name) + "</div></div>";
      });
      html += "</div></div>";
    }

    html += "</div>"; // .card
    if (d) html += '<div class="foot">Обновява се автоматично</div>';

    app.innerHTML = html;

    bind("feed",    function () { feed(false); });
    bind("again",   function () { set({ confirming: true, flash: null }); });
    bind("confirm", function () { feed(true); });
    bind("cancel",  function () { set({ confirming: false }); });
    bind("undo",    undo);
    bind("retry",   function () { set({ loading: !S.data }); load(); });
    bind("retry2",  function () { set({ loading: true }); load(); });
  }

  function bind(id, fn) {
    var el = document.getElementById(id);
    if (el) el.addEventListener("click", fn);
  }

  // ---- lifecycle ---------------------------------------------------------
  // Nobody should ever read a cached answer: refresh whenever the phone
  // comes back to the page, and quietly while it's open.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) load();
  });
  window.addEventListener("pageshow", function (e) { if (e.persisted) load(); });
  window.addEventListener("online", function () { S.retries = 0; load(); });
  window.addEventListener("focus", function () {
    if (Date.now() - S.goodAt > 30000) load();
  });

  setInterval(function () { if (!document.hidden) load(); }, 60000);
  // Keep "преди 20 минути" honest without refetching.
  tickTimer = setInterval(function () {
    if (!document.hidden && S.data && !S.busy) render();
  }, 30000);

  load();
})();
</script>
</body>
</html>
